name: Main Daily Guard

# Daily must-pass guard for merges to main. A small hand-picked set of ADB
# emulator and offline perception tasks (benchmark/ci/main_daily_guard.json)
# must pass on every attempt; any failure fails the run and alerts a dedicated
# Lark group with the commits merged since the last passing run.

on:
  schedule:
    # 12:00 Asia/Shanghai daily (UTC 04:00). GitHub may start scheduled runs late.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      repeats:
        description: Attempts per task; every attempt must pass
        required: false
        default: '1'
        type: string
      notify:
        description: Send the Lark alert when the guard fails
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # The failure alert reads this workflow's last successful run on main.
  actions: read

concurrency:
  group: main-daily-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        name: Build guard matrix
        working-directory: benchmark
        run: |
          set -euo pipefail
          matrix="$(python3 -m ci.main_daily_guard matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Summarize plan
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          cases = json.loads(os.environ["MATRIX"])["include"]
          print("## Main daily guard plan")
          for case in cases:
              print(f"- {case['id']} ({case['environment']}): {', '.join(case['task_ids'])}")
          PY

  run:
    needs: plan
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: ${{ vars.AICO_RUNNER_PRIMARY || 'aiden-hosted-02' }}
    # ADB cases share one emulator and run one at a time under the driver's hardware
    # lock; each inherits its catalog timeout. This ceiling only stops a stuck batch.
    timeout-minutes: 600
    env:
      MATRIX: ${{ needs.plan.outputs.matrix }}
      RUN_ID_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BENCHMARK_CI_MAX_PARALLEL: '2'
      BENCHMARK_REPEATS: ${{ inputs.repeats || '1' }}
      BENCHMARK_AGENT_PROVIDER: ${{ vars.BENCHMARK_AGENT_PROVIDER }}
      DOCKER_BUILDKIT: 1
      BENCHMARK_AGENT_MODEL: ${{ vars.BENCHMARK_AGENT_MODEL }}
      BENCHMARK_AGENT_BASE_URL: ${{ vars.BENCHMARK_AGENT_BASE_URL }}
      BENCHMARK_AGENT_API_KEY: ${{ secrets.BENCHMARK_AGENT_API_KEY }}
      BENCHMARK_JUDGE_MODEL: ${{ vars.BENCHMARK_JUDGE_MODEL || 'anthropic/claude-sonnet-4-6' }}
      BENCHMARK_JUDGE_BASE_URL: ${{ vars.BENCHMARK_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
      BENCHMARK_JUDGE_API_KEY: ${{ secrets.BENCHMARK_JUDGE_API_KEY }}
      DAEMON_IMAGE: ${{ vars.DAEMON_IMAGE || 'aico-agent-daemon:local' }}
      DAEMON_DOCKERFILE: benchmark/docker/Dockerfile.agent-daemon.cn
      MOBILEGYM_IMAGE: aico-mobilegym-simulator:py311
      BENCHMARK_CI_IMAGES_PREPARED: '1'
      PREPARE_LOG: runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-prepare-images/mobilegym-image.log
      # Same proxy contract as benchmark.yml: https only, never inherited by Docker builds.
      https_proxy: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal
      LANGFUSE_PUBLISH_VERIFY_TIMEOUT_SECONDS: '90'
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      BENCHMARK_TELEMETRY: '1'
      LANGFUSE_HTTPS_PROXY: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
      ANDROID_SERIAL: ${{ vars.BENCHMARK_ANDROID_SERIAL }}
    steps:
      - name: Reclaim persistent runner workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$owner" "$GITHUB_WORKSPACE"
            elif [[ "$(id -u)" == "0" ]]; then
              chown -R "$owner" "$GITHUB_WORKSPACE"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reap orphaned benchmark containers and run directories
        # Same prefix-and-age sweep as benchmark.yml; 8h is past the longest suite timeout.
        continue-on-error: true
        env:
          REAP_AGE_HOURS: '8'
        run: |
          set -uo pipefail
          cutoff=$(( $(date +%s) - REAP_AGE_HOURS * 3600 ))
          for prefix in aico-benchmark-agent- aico-mobilegym-env-; do
            for id in $(docker ps -aq --filter "name=$prefix"); do
              created="$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null)" || continue
              [[ -n "$created" ]] || continue
              created_epoch="$(date -d "$created" +%s 2>/dev/null)" || continue
              if (( created_epoch < cutoff )); then
                name="$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null)"
                echo "Reaping stale container ${name#/} (created $created)"
                docker rm -f "$id" >/dev/null 2>&1 || true
              fi
            done
          done
          for id in $(docker network ls -q --filter "label=com.docker.compose.project"); do
            project="$(docker network inspect -f '{{ index .Labels "com.docker.compose.project" }}' "$id" 2>/dev/null)" || continue
            [[ "$project" == aico-benchmark-agent-* ]] || continue
            created="$(docker network inspect -f '{{.Created}}' "$id" 2>/dev/null)" || continue
            created_epoch="$(date -d "$created" +%s 2>/dev/null)" || continue
            if (( created_epoch < cutoff )); then
              echo "Reaping stale Compose network $project (created $created)"
              docker network rm "$id" >/dev/null 2>&1 || true
            fi
          done
          if [[ -d benchmark/runs ]]; then
            find benchmark/runs -mindepth 1 -maxdepth 1 -type d \
              -not -name cli-services \
              -mmin "+$(( REAP_AGE_HOURS * 60 ))" \
              -print -exec rm -rf {} + 2>/dev/null || true
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Install Python and benchmark dependencies
        working-directory: benchmark
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12
      - name: Install Docker Compose V2
        run: |
          set -euo pipefail
          if docker compose version >/dev/null 2>&1; then
            docker compose version
            exit 0
          fi
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
          chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          docker compose version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Validate benchmark credentials
        env:
          REQUIRED_VALUES: >-
            BENCHMARK_AGENT_PROVIDER
            BENCHMARK_AGENT_MODEL
            BENCHMARK_AGENT_BASE_URL
            BENCHMARK_AGENT_API_KEY
            BENCHMARK_JUDGE_API_KEY
            LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY
            LANGFUSE_BASE_URL
        run: |
          set -euo pipefail
          missing=()
          for name in $REQUIRED_VALUES; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing benchmark configuration: ${missing[*]}" >&2
            exit 1
          fi
      - name: Validate Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker info
      - name: Validate Android device
        if: ${{ contains(needs.plan.outputs.matrix, '"environment":"adb"') }}
        env:
          ANDROID_SDK_DIR: ${{ vars.BENCHMARK_ANDROID_SDK_DIR || '~/android-sdk' }}
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_SDK_DIR/#\~/$HOME}"
          if [[ -z "${ANDROID_SERIAL:-}" ]]; then
            echo "ADB cases require the BENCHMARK_ANDROID_SERIAL repository variable" >&2
            exit 1
          fi
          if ! command -v adb >/dev/null 2>&1; then
            [[ -x "$sdk_dir/platform-tools/adb" ]] || { echo "adb not found under $sdk_dir/platform-tools" >&2; exit 1; }
            export PATH="$sdk_dir/platform-tools:$PATH"
            echo "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
          fi
          adb start-server
          timeout 300 adb -s "$ANDROID_SERIAL" wait-for-device
          for _ in $(seq 1 100); do
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              echo "$ANDROID_SERIAL is booted (Android $(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.release | tr -d '\r'))"
              exit 0
            fi
            sleep 3
          done
          echo "$ANDROID_SERIAL did not finish booting" >&2
          adb devices >&2
          exit 1
      - name: Prepare benchmark images
        working-directory: benchmark
        run: >-
          uv run python -m ci.prepare_images
          --matrix-json "$MATRIX"
          --daemon-image "$DAEMON_IMAGE"
          --daemon-dockerfile "$DAEMON_DOCKERFILE"
          --mobilegym-image "$MOBILEGYM_IMAGE"
          --mobilegym-log "$PREPARE_LOG"
      - name: Run guard cases
        id: cases
        working-directory: benchmark
        run: >-
          uv run python -m ci.run_cases
          --matrix-json "$MATRIX"
          --run-id-prefix "$RUN_ID_PREFIX"
          --max-parallel "$BENCHMARK_CI_MAX_PARALLEL"
      - name: Clean up benchmark services
        if: ${{ always() }}
        run: |
          set -uo pipefail
          for id in $(docker ps -aq --filter "name=aico-benchmark-agent-${RUN_ID_PREFIX}"); do
            project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$id" 2>/dev/null)"
            if [[ -n "$project" ]]; then
              docker compose \
                -f benchmark/docker/docker-compose.agent-daemon.yml \
                -p "$project" down --volumes --remove-orphans \
                >/dev/null 2>&1 || true
            fi
            docker rm -f "$id" >/dev/null 2>&1 || true
          done
          for pid_file in benchmark/runs/cli-services/adb-android-"${RUN_ID_PREFIX}"*/adb-android.pid; do
            [[ -s "$pid_file" ]] || continue
            kill -TERM "$(cat "$pid_file")" >/dev/null 2>&1 || true
          done
      - name: Publish completed runs to Langfuse
        # Observability is a side channel: a publish failure must not mask the verdict.
        if: ${{ always() }}
        continue-on-error: true
        working-directory: benchmark
        run: |
          set -uo pipefail
          attempted=0
          failed=0
          for manifest in runs/"${RUN_ID_PREFIX}"-*/manifest.json; do
            [[ -f "$manifest" ]] || continue
            run_dir="$(dirname "$manifest")"
            attempted=$((attempted + 1))
            if ! uv run python -m runner publish-langfuse --run-dir "$run_dir"; then
              failed=$((failed + 1))
              echo "::warning::Langfuse publication failed for $(basename "$run_dir")"
            fi
          done
          echo "Langfuse publication: $attempted attempted, $failed failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Check guard verdict
        id: verdict
        if: ${{ always() }}
        working-directory: benchmark
        run: >-
          uv run python -m ci.main_daily_guard verdict
          --matrix-json "$MATRIX"
          --runs-dir runs
          --run-id-prefix "$RUN_ID_PREFIX"
          --repeats "$BENCHMARK_REPEATS"
          --output main-daily-guard-verdict.json
      - name: Alert Lark on guard failure
        # Also covers setup failures that stop the guard before any verdict exists.
        if: ${{ always() && (failure() || steps.verdict.outputs.status != 'pass') && (github.event_name == 'schedule' || inputs.notify) }}
        continue-on-error: true
        working-directory: benchmark
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_DAILY_GUARD_LARK_WEBHOOK_URL: ${{ secrets.MAIN_DAILY_GUARD_LARK_WEBHOOK_URL }}
          MAIN_DAILY_GUARD_LARK_WEBHOOK_SECRET: ${{ secrets.MAIN_DAILY_GUARD_LARK_WEBHOOK_SECRET }}
          CASES_OUTCOME: ${{ steps.cases.outcome }}
        run: >-
          uv run python -m ci.main_daily_guard notify
          --verdict-json main-daily-guard-verdict.json
          --cases-outcome "$CASES_OUTCOME"
      - name: Upload guard artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: main-daily-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/main-daily-guard-verdict.json
            benchmark/${{ env.PREPARE_LOG }}
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/manifest.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/metrics.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/results.jsonl
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/summary.md
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/report.html
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/suite.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/tasks/**/trace.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/tasks/**/history.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/tasks/**/episode.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/tasks/**/setup.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/tasks/**/setup_failure.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/workers/*/daemon.log
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/workers/*/runner.log
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/auto-agent-setup.log
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/ci-case.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
      - name: Enforce main daily guard
        # Last, so artifacts and the alert exist before the job is marked failed.
        if: ${{ always() && steps.verdict.outputs.status == 'fail' }}
        run: |
          echo "One or more must-pass guard tasks did not pass; see the Main daily guard summary." >&2
          exit 1
