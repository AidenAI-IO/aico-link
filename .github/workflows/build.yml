name: Debian Build (reusable)

# Reusable Debian armhf firmware build.
#
# This drives ./debian_build.sh end to end -- applications, system
# rootfs/BSP, A/B factory images, a locally signed OTA manifest and the final
# audit -- uploads workflow artifacts. Channel publication belongs to release.yml.
# It replaced the retired
# Buildroot image pipeline and the one-off debian-build.yml workflow.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to execute the build on (Aico runner alias or runs-on value)'
        type: string
        required: true
      dry_run:
        description: 'Preflight only: check the runner, secrets and toolchain, then stop before the firmware build'
        type: boolean
        default: false
      source_ref:
        description: 'Exact source commit from the channel release plan'
        type: string
        default: ''
      release_plan_artifact:
        description: 'Optional channel plan artifact; empty builds local firmware artifacts only'
        type: string
        default: ''
      free_disk_space:
        description: 'Free up disk space before building (hosted runners only)'
        type: boolean
        default: false
      apt_cache_proxy:
        description: 'Optional HTTP cache proxy reachable from the rootfs container; defaults to repository variable DEBIAN_SYSTEM_APT_CACHE_PROXY'
        type: string
        default: ''
    secrets:
      OTA_ED25519_PRIVATE_KEY:
        required: true
      AGENT_CONFIG_TOML:
        required: false

permissions:
  contents: read

jobs:
  build:
    # Every self-hosted runner this job can land on needs the repo-branch guard:
    # never execute pull request code on one. scripts/test_github_actions_self_hosted_safety.sh
    # enforces that a job with a dynamic runs-on carries this expression. The
    # first arm keeps non-self-hosted (hosted) fallback runners running.
    if: ${{ (inputs.runner != 'self-hosted' && !startsWith(inputs.runner, 'aico-hosted-') && !startsWith(inputs.runner, 'aiden-hosted-')) || (startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target') }}
    # Keep canonical workflow inputs independent of the runners' external labels.
    # Repository variables can switch registrations after the runners are renamed.
    runs-on: ${{ inputs.runner == 'aico-hosted-01' && (vars.AICO_RUNNER_PRIMARY || 'aiden-hosted-01') || inputs.runner == 'aico-hosted-02' && (vars.AICO_RUNNER_BACKUP || 'aiden-hosted-02') || inputs.runner }}
    timeout-minutes: 300

    steps:
    - name: Reclaim workspace ownership
      if: ${{ inputs.runner == 'self-hosted' || startsWith(inputs.runner, 'aico-hosted-') || startsWith(inputs.runner, 'aiden-hosted-') }}
      # The system stage assembles images in privileged containers, so output/ and
      # pico-sdk build outputs can be owned by root. actions/checkout's clean phase
      # now cleans the tracked SDK tree too and would fail with EACCES,
      # and Go's module cache adds read-only directories it cannot remove
      # either. Both are cleared before checkout touches the tree.
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ]; then
          exit 0
        fi
        owner="$(id -u):$(id -g)"
        if command -v sudo >/dev/null 2>&1; then
          sudo chown -R "$owner" "$GITHUB_WORKSPACE"
        elif [ "$(id -u)" -eq 0 ]; then
          chown -R "$owner" "$GITHUB_WORKSPACE"
        else
          echo "::warning::Skipping workspace ownership reclaim because sudo is unavailable and the current user is not root"
        fi
        for go_mod_cache in \
          "$GITHUB_WORKSPACE/.cache" \
          "$GITHUB_WORKSPACE/build/.cache/go-mod"; do
          if [ -d "$go_mod_cache" ]; then
            chmod -R u+w "$go_mod_cache" || \
              echo "::warning::Skipping stale Go module cache unlock because chmod failed: $go_mod_cache"
          fi
        done

    - name: Remove legacy pico-sdk Git metadata
      if: ${{ inputs.runner == 'self-hosted' || startsWith(inputs.runner, 'aico-hosted-') || startsWith(inputs.runner, 'aiden-hosted-') }}
      # Runners may still have the former submodule checkout. Remove it before
      # checkout replaces the gitlink with the SDK files tracked in this repository.
      # An ordinary SDK directory has no nested Git metadata and is left for
      # actions/checkout to restore and clean with the rest of the source tree.
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ]; then
          exit 0
        fi
        sdk_dir="$GITHUB_WORKSPACE/pico-sdk"
        sdk_git_dir="$GITHUB_WORKSPACE/.git/modules/pico-sdk"
        if [ -e "$sdk_dir/.git" ] || [ -e "$sdk_git_dir" ]; then
          rm -rf -- "$sdk_dir" "$sdk_git_dir"
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_ref || github.sha }}
        submodules: false
        # The build makes no Git API calls after checkout.
        persist-credentials: false

    - name: Download channel release plan
      if: ${{ inputs.release_plan_artifact != '' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: output/release/

    - name: Verify Debian build script policies
      # Static contract checks over debian_build.sh and the apps/system scripts.
      # Seconds here, versus discovering the same drift an hour into the build.
      shell: bash
      run: |
        set -uo pipefail
        status=0
        for policy_test in test_debian_apps test_debian_system test_debian_build test_debian_apt_cache; do
          script="scripts/${policy_test}.sh"
          if [ "$policy_test" = test_debian_build ] && ! command -v jq >/dev/null 2>&1; then
            # jq is required to run the Debian entrypoint contract test. Skipping
            # it silently would let the policy gate pass without validating the
            # workflow, so fail instead of continuing with a zero status.
            echo "::warning::Skipping ${script} because jq is not installed on this runner"
            echo "::error::jq is required to run ${script}; install jq on the runner"
            status=1
            continue
          fi
          # These suites assert with bare `grep -q` and `[ ... ]`, which exit 1
          # without printing, so a bare failure here says only "exit 1". Trace
          # every attempt to a file and show it only when that attempt failed:
          # re-running afterwards is useless for the flaky assertion below,
          # which often passes the second time.
          attempt=1
          while :; do
            trace="${RUNNER_TEMP}/${policy_test}.attempt${attempt}.trace"
            if bash -x "$script" >"$trace" 2>&1; then
              echo "${script}: passed (attempt ${attempt})"
              break
            fi
            echo "::group::${script} attempt ${attempt} xtrace (last 60 lines)"
            tail -60 "$trace"
            echo "::endgroup::"
            if [ "$attempt" -ge 2 ]; then
              echo "::error::${script} failed twice; the trace above ends at the failing assertion"
              status=1
              break
            fi
            # test_debian_apps.sh ends in a live mock stress run whose
            # assertions read host timing, CMA recovery and log patterns, so it
            # fails under load on a shared runner. One repeat separates that
            # from a real regression, which fails both times.
            echo "::warning::${script} failed; retrying once"
            attempt=2
          done
        done
        exit "$status"

    - name: Free hosted runner disk space
      if: ${{ inputs.free_disk_space }}
      shell: bash
      run: |
        df -h
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        docker system prune -af || true
        df -h

    - name: Install hosted runner prerequisites
      # The Debian build host preflight below requires these; the dedicated
      # self-hosted runners already provide them.
      if: ${{ inputs.runner != 'self-hosted' && !startsWith(inputs.runner, 'aico-hosted-') && !startsWith(inputs.runner, 'aiden-hosted-') }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends device-tree-compiler

    - name: Verify build host prerequisites
      # debian_build.sh's own list, plus what the system-stage host-side BSP audit
      # needs. audit-bsp.sh runs outside the build containers and is only
      # reached after the kernel is built, so a tool missing there costs a
      # two-hour build. Checking the union here also gives the dry run
      # something to report, since it never reaches either script's own check.
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for command in awk cmp curl date docker fdtget find getconf git grep id \
          install od openssl python3 readlink sha256sum sort stat tar tr xargs; do
          command -v "$command" >/dev/null 2>&1 || missing+=("$command")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing required build host commands: ${missing[*]}" >&2
          for command in "${missing[@]}"; do
            case "$command" in
              fdtget)
                echo "  ${command}: provided by the device-tree-compiler package" >&2
                ;;
            esac
          done
          exit 1
        fi
        docker info >/dev/null 2>&1 || {
          echo "Docker is unavailable; the runner user must be able to reach the daemon" >&2
          exit 1
        }
        echo "All required build host commands are present"

    - name: Report available disk space
      shell: bash
      run: df -h "$GITHUB_WORKSPACE" /var/lib/docker 2>/dev/null || df -h

    - name: Configure Go proxy
      # Pipe-separated, not comma-separated: with commas the go command only
      # moves to the next proxy on 404/410, and a reset connection fails the
      # build. With pipes it moves on after any error. Both proxies have been
      # unreachable from the runners at different times -- goproxy.cn's CDN
      # edge for this network answered every request with a reset for a day --
      # so neither is trusted alone, and direct (github.com) is the last resort.
      run: echo "GOPROXY=https://goproxy.cn|https://proxy.golang.org|direct" >> "$GITHUB_ENV"

    - name: Set up Go
      # cache: false because nothing here consumes what it would cache. Every
      # `go build` runs inside the apps-stage container against the bind-mounted
      # pinned toolchain, with GOCACHE/GOMODCACHE pointed at the persistent
      # caches below. Uploading ~/go/pkg/mod to the hosted cache service only
      # cost a minute per run and failed with ECONNRESET twice.
      uses: actions/setup-go@v5
      with:
        go-version-file: src/agent/go.mod
        cache: false

    - name: Prepare agent configuration
      # The system stage installs an external agent.toml into the userdata image and never
      # copies one out of the source tree. Validate it here so a bad secret
      # fails in seconds instead of an hour into the image assembly step.
      env:
        AGENT_CONFIG_TOML: ${{ secrets.AGENT_CONFIG_TOML }}
      shell: bash
      run: |
        set -euo pipefail
        agent_config="$RUNNER_TEMP/agent.toml"
        if [ -n "${AGENT_CONFIG_TOML:-}" ]; then
          printf '%s\n' "$AGENT_CONFIG_TOML" > "$agent_config"
          echo "Using the AGENT_CONFIG_TOML repository secret"
        else
          cp src/agent/config/agent.toml "$agent_config"
          echo "::warning::AGENT_CONFIG_TOML secret is unset; building with the src/agent/config/agent.toml template, which carries no provider credentials"
        fi
        chmod 600 "$agent_config"
        (cd src/agent && go run ./cmd/daemon config-check --format=json --config="$agent_config")
        echo "AGENT_CONFIG_PATH=$agent_config" >> "$GITHUB_ENV"

    - name: Prepare OTA signing keys
      env:
        OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${OTA_ED25519_PRIVATE_KEY:-}" ]; then
          echo "OTA_ED25519_PRIVATE_KEY secret is required to sign the Debian OTA manifest" >&2
          exit 1
        fi
        private_key="$RUNNER_TEMP/ota_ed25519_private_key.pem"
        public_key="$RUNNER_TEMP/ota_ed25519_public_key.pem"
        printf '%s\n' "$OTA_ED25519_PRIVATE_KEY" > "$private_key"
        chmod 600 "$private_key"
        openssl pkey -in "$private_key" -pubout -out "$public_key"
        scripts/validate_ota_pubkey.sh "$public_key"
        echo "OTA_PRIVATE_KEY_PATH=$private_key" >> "$GITHUB_ENV"
        echo "OTA_PUBLIC_KEY_PATH=$public_key" >> "$GITHUB_ENV"
        # Pin the trust anchor to the key this build signs with. Left unset,
        # debian_build.sh would bake in the committed keys/ota_pubkey.pem, and
        # a rotated secret would then ship images trusting the previous signer
        # while the manifests came from the new one.
        echo "OTA_TRUST_PUBLIC_KEY_PATH=$public_key" >> "$GITHUB_ENV"

    - name: Ensure armhf binfmt registration
      # The system stage runs the freshly built armhf agent on the host to validate
      # agent.toml, so the kernel needs an arm interpreter. The rootfs builder
      # registers one for its own chroot, but only after that point.
      shell: bash
      run: |
        set -euo pipefail
        binfmt_dir=/proc/sys/fs/binfmt_misc
        if [ -r "$binfmt_dir/qemu-arm" ] && grep -qx enabled "$binfmt_dir/qemu-arm"; then
          echo "qemu-arm binfmt handler is already registered"
          exit 0
        fi
        docker run --privileged --rm \
          tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 \
          --install arm
        if [ ! -r "$binfmt_dir/qemu-arm" ] || ! grep -qx enabled "$binfmt_dir/qemu-arm"; then
          echo "qemu-arm binfmt registration failed; the host cannot execute armhf binaries" >&2
          exit 1
        fi

    - name: Resolve build metadata
      id: meta
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        commit=$(git rev-parse --short=12 HEAD)
        timestamp=$(date -u +'%Y%m%d-%H%M%S')
        build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        branch=$(printf '%s' "$GITHUB_REF_NAME" | sed 's#/#-#g; s#[^a-zA-Z0-9._-]#-#g')

        if [ "$GITHUB_REF_NAME" = "main" ]; then
          channel="debian-stable"
        else
          channel="debian-dev-${branch}"
        fi

        # Build with everything the runner has. debian_build.sh caps its own
        # default at the online CPU count, which would hold a larger machine
        # down to that default rather than use it.
        rk_jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)
        case "$rk_jobs" in
          '' | *[!0-9]* | 0)
            echo "could not determine the online CPU count: '$rk_jobs'" >&2
            exit 1
            ;;
        esac

        {
          echo "version=debian-${timestamp}-${commit}"
          echo "channel=${channel}"
          echo "build_time=${build_time}"
          echo "artifact_name=debian-firmware-${branch}-${timestamp}-${commit}"
          echo "rk_jobs=${rk_jobs}"
        } >> "$GITHUB_OUTPUT"
        echo "Building with RK_JOBS=${rk_jobs}"

    - name: Reuse the persistent toolchain and build caches
      shell: bash
      run: |
        set -euo pipefail
        cache="$HOME/aico-ci"
        # Everything the apps stage caches defaults into the workspace, which
        # actions/checkout wipes with `git clean -ffdx` before every run. Point
        # the caches at the runner's home so they actually survive. On a hosted
        # runner the home is ephemeral and this is simply a cold cache.
        mkdir -p \
          "$cache/apps-go-build" "$cache/apps-go-mod" "$cache/apps-opencv"
        {
          echo "DEBIAN_APPS_GO_BUILD_CACHE=$cache/apps-go-build"
          echo "DEBIAN_APPS_GO_MODULE_CACHE=$cache/apps-go-mod"
          echo "DEBIAN_APPS_OPENCV_CACHE=$cache/apps-opencv"
        } >> "$GITHUB_ENV"

        # ensure_go_toolchain() rejects an invalid custom root outright rather
        # than falling back to the pinned download, so only name one that is
        # already provisioned. A runner without it keeps downloading its own.
        go_root="$cache/go1.26.0.linux-amd64"
        if [ -x "$go_root/bin/go" ] && [ -f "$go_root/VERSION" ] &&
          grep -qx 'go1.26.0' "$go_root/VERSION"; then
          echo "DEBIAN_APPS_GO_ROOT=$go_root" >> "$GITHUB_ENV"
          echo "Using the pre-provisioned Go toolchain at $go_root"
        else
          echo "::notice::No pre-provisioned Go toolchain at $go_root; the build will download its own"
        fi

    - name: Run Debian firmware build
      id: firmware
      if: ${{ !inputs.dry_run && inputs.release_plan_artifact == '' }}
      env:
        RK_JOBS: ${{ steps.meta.outputs.rk_jobs }}
        # The rootfs container validates this candidate against the mirror's
        # signed InRelease before using it. Existing proxies take precedence.
        DEBIAN_SYSTEM_APT_CACHE_PROXY: ${{ inputs.apt_cache_proxy || vars.DEBIAN_SYSTEM_APT_CACHE_PROXY }}
        OTA_REPO: ${{ github.repository }}
        OTA_CHANNEL: ${{ steps.meta.outputs.channel }}
        OTA_BUILD_VERSION: ${{ steps.meta.outputs.version }}
        OTA_BUILD_TIME: ${{ steps.meta.outputs.build_time }}
      run: ./debian_build.sh

    - name: Build and verify channel firmware
      if: ${{ !inputs.dry_run && inputs.release_plan_artifact != '' }}
      env:
        RK_JOBS: ${{ steps.meta.outputs.rk_jobs }}
        DEBIAN_SYSTEM_APT_CACHE_PROXY: ${{ inputs.apt_cache_proxy || vars.DEBIAN_SYSTEM_APT_CACHE_PROXY }}
      run: |
        bash scripts/test_system_config_package.sh
        python3 scripts/release/release.py build --plan output/release/plan.json

    - name: Verify production ARM build in the pinned test image
      if: ${{ !inputs.dry_run && inputs.release_plan_artifact == '' }}
      env:
        AICO_TEST_IMAGE: aico-link-firmware-test:build-${{ github.run_id }}
      run: bash scripts/run_tests_in_docker.sh --production --suite production-cross-smoke

    - name: Upload production smoke summary
      if: ${{ always() && !inputs.dry_run && inputs.release_plan_artifact == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: production-smoke-summary-${{ github.run_id }}
        path: output/test-summary.json
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload channel release assets
      if: ${{ !inputs.dry_run && inputs.release_plan_artifact != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: channel-release-assets
        path: output/release/assets/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0

    - name: Summarize firmware output
      if: ${{ !inputs.dry_run && inputs.release_plan_artifact == '' }}
      shell: bash
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        CHANNEL: ${{ steps.meta.outputs.channel }}
      run: |
        set -euo pipefail
        image_dir=output/debian/image
        {
          echo "## Debian firmware"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Version | \`${VERSION}\` |"
          echo "| Channel | \`${CHANNEL}\` |"
          echo "| Commit | \`${GITHUB_SHA}\` |"
          echo "| update.img SHA-256 | \`$(awk '{print $1}' "${image_dir}/update.img.sha256")\` |"
          echo
          echo "| Artifact | Size |"
          echo "| --- | ---: |"
          for artifact in "${image_dir}"/*.tar.gz "${image_dir}"/manifest.json; do
            [ -f "$artifact" ] || continue
            echo "| $(basename "$artifact") | $(du -h "$artifact" | cut -f1) |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Debian firmware artifacts
      if: ${{ !inputs.dry_run && inputs.release_plan_artifact == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.artifact_name }}
        # update.img itself ships as update.img.tar.gz: uploading the raw copy
        # too would double an already large transfer for no extra content.
        path: |
          output/debian/image/*.tar.gz
          output/debian/image/manifest.json
          output/debian/image/update.img.sha256
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

    - name: Upload Debian build reports
      if: ${{ always() && !inputs.dry_run }}
      uses: actions/upload-artifact@v4
      with:
        name: debian-build-reports-${{ steps.meta.outputs.artifact_name || github.run_id }}
        path: |
          output/debian-apps/apps-audit/summary.txt
          output/debian-system/audit-report.txt
        if-no-files-found: ignore
        retention-days: 7

    - name: Remove build secrets from the runner
      if: always()
      shell: bash
      run: |
        rm -f \
          "$RUNNER_TEMP/agent.toml" \
          "$RUNNER_TEMP/ota_ed25519_private_key.pem" \
          "$RUNNER_TEMP/ota_ed25519_public_key.pem"

    - name: Leave the workspace cleanable
      # The apps stage fills .cache/debian-apps/go-mod with read-only module
      # directories. They outlive this job and would block the clean phase of
      # the next checkout here, so unlock them before handing the runner back.
      if: always()
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/.cache" ]; then
          chmod -R u+w "$GITHUB_WORKSPACE/.cache" || \
            echo "::warning::Could not unlock $GITHUB_WORKSPACE/.cache for the next checkout"
        fi
