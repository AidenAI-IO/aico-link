<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Aico Link</title>
<style>
:root{--canvas:#F6F8FA;--card:#FFFFFF;--ink:#111214;--ink2:#8A8A8E;--border:#D6D6DA;--focus:#5478FF;--danger:#FF3B30;--fill:#000000;--fill-ink:#FFFFFF;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--canvas:#000000;--card:#1C1C1E;--ink:#F5F5F7;--ink2:#98989F;--border:#3A3A3C;--focus:#6E8BFF;--danger:#FF453A;--fill:#FFFFFF;--fill-ink:#000000;--shadow:none}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:40px 28px 32px;box-shadow:var(--shadow);text-align:center}
.logo{display:block;width:96px;height:auto;margin:0 auto 28px;color:var(--ink)}
h1{margin:0 0 6px;font-size:20px;font-weight:600;line-height:1.3}
.sub{margin:0 0 24px;font-size:14px;color:var(--ink2);line-height:1.5}
input[type=password]{display:block;width:100%;height:48px;padding:0 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:var(--focus)}
input[type=password][aria-invalid=true]{border-color:var(--danger)}
.error{margin:10px 2px 0;font-size:13px;color:var(--danger);text-align:left}
button{display:block;width:100%;height:48px;margin-top:16px;border:0;border-radius:12px;background:var(--fill);color:var(--fill-ink);font-size:16px;font-weight:600;cursor:pointer}
button:active{opacity:.8}
.foot{margin:20px 0 0;font-size:12px;color:var(--ink2);line-height:1.5}
</style>
</head>
<body>
<main>

<h1>登录 · Sign in</h1>
<p class="sub">请输入设备密码<br>Enter the device password</p>
<form method="post" action="{{.Action}}">
<input type="hidden" name="next" value="{{.Next}}">
<input type="password" name="password" autocomplete="current-password" autofocus required placeholder="设备密码 / Device password" aria-label="Device password"{{if .Error}} aria-invalid="true"{{end}}>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<button type="submit">登录 · Sign in</button>
</form>
<p class="foot">忘记密码？请通过 USB 连接设备后重新设置。<br>Forgot it? Reset it over USB.</p>
</main>
</body>
</html>
