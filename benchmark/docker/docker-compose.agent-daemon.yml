services:
  daemon:
    # Runtime drains pending telemetry on SIGTERM before Docker removes the worker.
    stop_grace_period: 90s
    image: ${AICO_DAEMON_IMAGE:-aico-agent-daemon:local}
    build:
      context: ../..
      dockerfile: ${DAEMON_DOCKERFILE:-benchmark/docker/Dockerfile.agent-daemon}
      target: agent-daemon-runtime
    ports:
      - "127.0.0.1:${AICO_DAEMON_HOST_PORT:-8080}:8080"
    volumes:
      - ${AICO_CONFIG_DIR:-../config}:/config:ro
    environment:
      AICO_ENVIRONMENT_BRIDGE_MODE: ${AICO_ENVIRONMENT_BRIDGE_MODE:-0}
      ENVIRONMENT_BRIDGE_ENDPOINT: ${ENVIRONMENT_BRIDGE_ENDPOINT:-}
      AICO_BENCHMARK_MOCK_TOOLS: ${AICO_BENCHMARK_MOCK_TOOLS:-0}
      AICO_BENCHMARK_TASK_ID: ${AICO_BENCHMARK_TASK_ID:-}
      AICO_DEVICE_TYPE: ${AICO_DEVICE_TYPE:-}
      AICO_BENCHMARK_TOKEN_FILE: ${AICO_BENCHMARK_TOKEN_FILE:-}
      AICO_RUNTIME_CONFIG_DIR: /tmp/aico-config
      # Dedicated to telemetry; model/device traffic keeps its existing routing.
      AICO_LANGFUSE_HTTPS_PROXY: ${AICO_LANGFUSE_HTTPS_PROXY:-}
      # Bypass local endpoints when the dedicated telemetry proxy is configured.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
