name: Benchmark proxy location diagnostic

on:
  push:
    branches: [feat/realtime-text-collaboration]
    paths: [.github/workflows/benchmark-proxy-location.yml]

permissions:
  contents: read

jobs:
  locate:
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name == 'push' }}
    runs-on: ${{ vars.AICO_RUNNER_PRIMARY || 'aiden-hosted-02' }}
    timeout-minutes: 5
    steps:
      - name: Locate proxy egress without exposing credentials
        env:
          DIAGNOSTIC_PROXY: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          proxy = os.environ.get('DIAGNOSTIC_PROXY', '').strip()
          if not proxy:
              raise SystemExit('BENCHMARK_HTTPS_PROXY is not configured')
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({'https': proxy}))
          sources = [
              ('ipapi.co', 'https://ipapi.co/json/',
               {'country': 'country_name', 'region': 'region', 'city': 'city',
                'network': 'org', 'asn': 'asn', 'timezone': 'timezone'}),
              ('ipwho.is', 'https://ipwho.is/',
               {'country': 'country', 'region': 'region', 'city': 'city'}),
          ]
          successes = 0
          for name, url, fields in sources:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'benchmark-egress-diagnostic/1.0'})
                  with opener.open(req, timeout=25) as response:
                      data = json.load(response)
                  if data.get('error') or data.get('success') is False:
                      print(json.dumps({'source': name, 'status': 'lookup_rejected'}))
                      continue
                  result = {'source': name, 'status': 'ok'}
                  result.update({label: data.get(key) for label, key in fields.items()})
                  print(json.dumps(result, ensure_ascii=False))
                  successes += 1
              except Exception as exc:
                  # Exception text may contain a credential-bearing proxy URL.
                  print(json.dumps({'source': name, 'status': 'lookup_failed', 'error_type': type(exc).__name__}))
          if not successes:
              raise SystemExit('No proxy geolocation lookup succeeded')
          PY
