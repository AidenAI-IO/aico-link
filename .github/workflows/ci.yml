name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  classify-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: /.github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Check for changes outside documentation
        id: diff
        shell: bash
        run: |
          # A PR checkout is the merge commit. Its first parent is the base
          # tree for this run. Disable rename detection to check both paths.
          if git diff --quiet --no-renames --ignore-submodules=none HEAD^1 HEAD -- \
              ':(top,glob,exclude)docs/**' \
              ':(top,glob,exclude)docs-zh/**' \
              ':(top,literal,exclude)README.md' \
              ':(top,literal,exclude)AGENTS.md'; then
            echo 'docs-only=true' >> "$GITHUB_OUTPUT"
          fi

  # Keep the workflow visible to required checks. Run tests unless the PR
  # classifier completed successfully and confirmed a documentation-only diff.
  benchmark-ci-catalog:
    needs: classify-pr
    if: ${{ !cancelled() && needs.classify-pr.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify every benchmark suite has a CI policy
        run: python3 benchmark/ci/plan.py validate
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Run benchmark CI planner tests
        working-directory: benchmark
        run: |
          uv sync --frozen --only-group dev
          uv run pytest tests/test_ci_plan.py tests/test_ci_prepare_images.py tests/test_ci_run_cases.py tests/test_ci_publish_langfuse.py -q

  github-actions-safety:
    needs: classify-pr
    if: ${{ !cancelled() && needs.classify-pr.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted runner safety
        run: bash scripts/test_github_actions_self_hosted_safety.sh

  manifest-tests:
    needs: classify-pr
    if: ${{ !cancelled() && needs.classify-pr.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch benchmark test fixtures
        run: git submodule update --init --depth=1 benchmark/mobilegym/vendor/mobilegym
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker test image and update persistent cache
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/test/Dockerfile
          platforms: linux/amd64
          load: true
          tags: aico-link-firmware-test:ci
          cache-from: type=gha,scope=aico-link-firmware-test
          cache-to: type=gha,mode=max,scope=aico-link-firmware-test
      - name: Build Docker test image from persistent cache
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/test/Dockerfile
          platforms: linux/amd64
          load: true
          tags: aico-link-firmware-test:ci
          cache-from: type=gha,scope=aico-link-firmware-test
      - name: Run the full Docker test manifest
        env:
          AICO_TEST_JOBS: '2'
          AICO_TEST_IMAGE: aico-link-firmware-test:ci
          AICO_TEST_SKIP_BUILD: '1'
        run: make check-full
      - name: Upload Docker test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-summary-${{ github.run_id }}
          path: output/test-summary.json
          if-no-files-found: ignore

  docker-tests:
    needs: classify-pr
    if: ${{ !cancelled() && needs.classify-pr.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Docker sandbox contract
        timeout-minutes: 25
        run: |
          bash scripts/run_tests_in_docker.sh \
            --docker-socket --host-network \
            --suite docker-package-contract \
            --suite docker-sandbox-smoke
      - name: Upload Docker contract summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-contract-summary-${{ github.run_id }}
          path: output/test-summary.json
          if-no-files-found: ignore
