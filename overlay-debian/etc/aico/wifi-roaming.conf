# Image-owned wpa_supplicant settings loaded after the user's network list
# (wpa_supplicant -I). Settings here override the same global setting in
# /userdata/debian/wifi/wpa_supplicant-wlan0.conf.
#
# Roam between access points of the same network while connected. Below
# -70 dBm, scan every 30 seconds and move to a sufficiently stronger AP of the
# same SSID; at or above it, scan hourly. The driver reports signal threshold
# crossings, so the interval follows the live signal. Each AIC8800 BSS
# transition interrupts traffic briefly; 20-wlan0.network keeps the DHCP
# address across that gap.
bgscan="simple:30:-70:3600"
