services:
  aico:
    platform: linux/amd64
    image: ${AICO_DOCKER_IMAGE:-aico-agent-sandbox:local}
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${AICO_CONFIG_WEB_PORT:-8000}:80"
      - "127.0.0.1:${AICO_AGENT_WEB_PORT:-8080}:8080"
    volumes:
      - aico-data:/userdata
    environment:
      AICO_ENVIRONMENT_BRIDGE_ENDPOINT: ${AICO_ENVIRONMENT_BRIDGE_ENDPOINT:-}
      ENVIRONMENT_BRIDGE_ENDPOINT: ${ENVIRONMENT_BRIDGE_ENDPOINT:-}
      AICO_ENVIRONMENT_BRIDGE_MODE: ${AICO_ENVIRONMENT_BRIDGE_MODE:-auto}
      AICO_BENCHMARK_TASK_ID: ${AICO_BENCHMARK_TASK_ID:-docker-sandbox}
      AICO_BRIDGE_EPISODE_ID: ${AICO_BRIDGE_EPISODE_ID:-docker-sandbox}
      AICO_DEVICE_TYPE: ${AICO_DEVICE_TYPE:-}
      AICO_PUBLIC_AGENT_WEB_PORT: ${AICO_AGENT_WEB_PORT:-8080}
      AICO_CONFIG_WEB_PORT: ${AICO_CONFIG_WEB_PORT:-8000}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null && curl -fsS http://127.0.0.1:8080/api/tools >/dev/null && curl -fsSL http://127.0.0.1:8080/webtty/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  aico-data:
