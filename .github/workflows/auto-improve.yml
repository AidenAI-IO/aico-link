name: Benchmark Auto-Improve
run-name: Auto-improve ${{ inputs.source_run || 'scheduled discovery' }}

on:
  schedule:
    # Odd calendar days (09:37 Asia/Shanghai); discovery aggregates all pending daily runs.
    # Month boundaries can produce consecutive days; sources are deduplicated individually.
    - cron: '37 1 */2 * *'
  workflow_dispatch:
    inputs:
      source_run:
        description: Optional comma-separated completed scheduled Benchmark run IDs from main
        type: string
        default: ''
      publish_issues:
        description: File or update issues after a successful main-branch run
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: benchmark-auto-improve
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.AUTO_IMPROVE_ENABLED == 'true'))
    runs-on: ${{ vars.AICO_RUNNER_PRIMARY || 'aiden-hosted-02' }}
    timeout-minutes: 150
    env:
      https_proxy: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal
    outputs:
      identity: ${{ steps.discover.outputs.identity }}
      artifact: ${{ steps.artifact.outputs.name }}
      publish: ${{ steps.mode.outputs.publish }}
      ready: ${{ steps.driver.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set persistent work directory
        env:
          AUTO_IMPROVE_WORK_ROOT: ${{ runner.tool_cache }}/aico-auto-improve/${{ github.repository }}
        run: |
          mkdir -p "$AUTO_IMPROVE_WORK_ROOT"
          echo "AUTO_IMPROVE_WORK_ROOT=$AUTO_IMPROVE_WORK_ROOT" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Install benchmark dependencies
        working-directory: benchmark
        run: uv sync --frozen --python 3.12
      - name: Recover owned emulators from interrupted runs
        working-directory: benchmark
        run: |
          uv run python -c 'import os; from pathlib import Path; from ci.auto_improve.emulator import cleanup_orphans; cleanup_orphans(Path(os.environ["AUTO_IMPROVE_WORK_ROOT"]))'
      - id: mode
        working-directory: benchmark
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish_issues || false }}
        run: |
          uv run python -m ci.auto_improve.control policy \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --publish-requested "$PUBLISH_REQUESTED"
      - name: Validate reproduction prerequisites
        run: |
          set -euo pipefail
          command -v git
          command -v docker
          docker info >/dev/null
          docker compose version
      - id: discover
        name: Collect the unprocessed main daily benchmark window
        working-directory: benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          AUTO_IMPROVE_DELAY_HOURS: ${{ vars.AUTO_IMPROVE_DELAY_HOURS || '3' }}
        run: >-
          uv run python -m ci.auto_improve.control discover
          --out "$AUTO_IMPROVE_WORK_ROOT/auto-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/source"
          --source-run "$SOURCE_RUN" --branch main
      - uses: actions/setup-node@v4
        if: steps.discover.outputs.found == 'true'
        with:
          node-version: '24.22.1'
      - name: Install the read-only review CLI
        if: steps.discover.outputs.found == 'true'
        run: |
          prefix="$AUTO_IMPROVE_WORK_ROOT/auto-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/cli"
          npm install --global --prefix "$prefix" --no-fund --no-audit '@anthropic-ai/claude-code@2.1.308'
          echo "AUTO_IMPROVE_CLAUDE=$prefix/bin/claude" >> "$GITHUB_ENV"
      - name: Locate the Android SDK for isolated ADB runs
        if: steps.discover.outputs.found == 'true'
        env:
          SDK_DIR: ${{ vars.BENCHMARK_ANDROID_SDK_DIR || '~/android-sdk' }}
        run: |
          sdk_dir="${SDK_DIR/#\~/$HOME}"
          if [[ -d "$sdk_dir" ]]; then
            echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
            echo "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
            echo "$sdk_dir/emulator" >> "$GITHUB_PATH"
          fi
      - name: Diagnose, reproduce and audit findings
        id: driver
        if: steps.discover.outputs.found == 'true'
        working-directory: benchmark
        env:
          AUTO_IMPROVE_REVIEW_MODEL: ${{ vars.AUTO_IMPROVE_REVIEW_MODEL }}
          AUTO_IMPROVE_REVIEW_BASE_URL: ${{ vars.AUTO_IMPROVE_REVIEW_BASE_URL }}
          AUTO_IMPROVE_REVIEW_API_KEY: ${{ secrets.AUTO_IMPROVE_REVIEW_API_KEY }}
          AUTO_IMPROVE_REVIEW_MAX_TURNS: ${{ vars.AUTO_IMPROVE_REVIEW_MAX_TURNS || '48' }}
          AUTO_IMPROVE_TIMEOUT_SECONDS: '7200'
          AUTO_IMPROVE_MAX_ISSUES: ${{ vars.AUTO_IMPROVE_MAX_ISSUES || '3' }}
          AUTO_IMPROVE_ISSUE_AUTHOR: ${{ vars.AUTO_IMPROVE_ISSUE_AUTHOR }}
          AUTO_IMPROVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTO_IMPROVE_AVD_TEMPLATE: ${{ vars.AUTO_IMPROVE_AVD_TEMPLATE }}
          AUTO_IMPROVE_AVD_SHA256: ${{ vars.AUTO_IMPROVE_AVD_SHA256 }}
          BENCHMARK_AGENT_PROVIDER: ${{ vars.BENCHMARK_AGENT_PROVIDER }}
          BENCHMARK_AGENT_MODEL: ${{ vars.BENCHMARK_AGENT_MODEL }}
          BENCHMARK_AGENT_BASE_URL: ${{ vars.BENCHMARK_AGENT_BASE_URL }}
          BENCHMARK_AGENT_API_KEY: ${{ secrets.BENCHMARK_AGENT_API_KEY }}
          BENCHMARK_JUDGE_MODEL: ${{ vars.BENCHMARK_JUDGE_MODEL || 'anthropic/claude-sonnet-4-6' }}
          BENCHMARK_JUDGE_BASE_URL: ${{ vars.BENCHMARK_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          BENCHMARK_JUDGE_API_KEY: ${{ secrets.BENCHMARK_JUDGE_API_KEY }}
          DAEMON_DOCKERFILE: benchmark/docker/Dockerfile.agent-daemon.cn
          MOBILEGYM_IMAGE: aico-mobilegym-simulator:py311
          MOBILEGYM_NODE_IMAGE: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:22-bookworm
          MOBILEGYM_DEBIAN_MIRROR: repo.huaweicloud.com
          https_proxy: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
          no_proxy: localhost,127.0.0.1,::1,host.docker.internal
        run: >-
          uv run python -m ci.auto_improve.driver
          --repo "$GITHUB_WORKSPACE"
          --source "$AUTO_IMPROVE_WORK_ROOT/auto-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/source"
          --out "$AUTO_IMPROVE_WORK_ROOT/auto-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/result"
      - name: Publish job summary
        if: always() && steps.discover.outputs.found == 'true'
        run: |
          report="$AUTO_IMPROVE_WORK_ROOT/auto-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/result/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Name the evidence artifact
        id: artifact
        if: always() && steps.discover.outputs.found == 'true'
        working-directory: benchmark
        env:
          IDENTITY: ${{ steps.discover.outputs.identity }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        # Only a settled, publishing run marks its sources processed; an errored, blocked,
        # cancelled or analyze-only run is uploaded as auto-improve-retry-* so it is retried.
        run: >-
          uv run python -m ci.auto_improve.control artifact --ref "$GITHUB_REF" --identity "$IDENTITY"
          --publish "${PUBLISH:-false}"
          --out "$AUTO_IMPROVE_WORK_ROOT/auto-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/result"
      - name: Retain evidence for fourteen days
        id: evidence
        if: always() && steps.discover.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          # If naming fails, still keep the evidence under a name nothing consumes:
          # it neither marks sources processed nor enables publication.
          name: ${{ steps.artifact.outputs.name || format('auto-improve-unnamed-{0}-{1}', github.run_id, github.run_attempt) }}
          retention-days: 14
          # Do not upload clones, daemon configurations, CLI sessions, or emulator disks.
          path: |
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/manifest.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/source-window.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/summary.md
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/diagnosis.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/diagnosis-error.log
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/diagnosis-usage.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/issues.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/issues/*.md
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/audit-*.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/audit-*-error.log
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/build/build.log
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/build/mobilegym-build.log
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/finding-*/reproduction-runs/*/*/evidence/**
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/finding-*/daily-observations.json
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/finding-*/reproduction-runs/*/*/runner.log
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/finding-*/reproduction-runs/*/*/rejudge-error.log
            ${{ env.AUTO_IMPROVE_WORK_ROOT }}/auto-improve-${{ github.run_id }}-${{ github.run_attempt }}/result/finding-*/reproduction-runs/*/*/emulator/emulator.log
          if-no-files-found: warn
      - name: Remove uploaded work files
        if: always() && steps.evidence.outcome == 'success'
        working-directory: benchmark
        run: |
          uv run python -c 'import os; from pathlib import Path; from ci.auto_improve.emulator import cleanup_orphans, cleanup_completed_work; root=Path(os.environ["AUTO_IMPROVE_WORK_ROOT"]); cleanup_orphans(root); cleanup_completed_work(root, "auto-improve-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])'

  publish:
    needs: analyze
    # Main-branch runs only; the publisher rechecks every draft against current issues.
    if: >-
      !cancelled() && needs.analyze.outputs.artifact != '' &&
      needs.analyze.outputs.publish == 'true' && fromJSON(needs.analyze.outputs.ready || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.artifact }}
          path: auto-improve-result
      - uses: astral-sh/setup-uv@v6
      - name: Install benchmark dependencies
        working-directory: benchmark
        run: uv sync --frozen --python 3.12
      - name: File and update issues
        working-directory: benchmark
        env:
          # Scoped to this job and never passed to model execution. An optional bot token can
          # be used if organization policy requires it; set AUTO_IMPROVE_ISSUE_AUTHOR to its login.
          GH_TOKEN: ${{ secrets.AUTO_IMPROVE_ISSUE_TOKEN || github.token }}
          AUTO_IMPROVE_ISSUE_AUTHOR: ${{ vars.AUTO_IMPROVE_ISSUE_AUTHOR }}
        run: >-
          uv run python -m ci.auto_improve.control publish
          --out "$GITHUB_WORKSPACE/auto-improve-result" --branch main
