AUDIO_SERVICE_BIN=/usr/lib/aico/audio_service
SOCKET_PATH=/run/audio_service/audio_service.sock
VOLUME_STATE_PATH=/userdata/audio_service/playback_volume
LOG_PATH=/var/log/audio_service/audio_service.log
# Hybrid DTLN noise suppression for mono PCM16 recording at 16/24 kHz.
AUDIO_SERVICE_DENOISE=1
AUDIO_SERVICE_DTLN_DIR=/usr/lib/aico/models/dtln
# Only the capture worker requests FIFO scheduling; 0 disables the request.
AUDIO_SERVICE_CAPTURE_RT_PRIORITY=10
