# Aico Link Debian production feature switches. These values are image-owned and
# are consumed through systemd EnvironmentFile= plus a strict ExecCondition.
ENABLE_USB_HID=1
ENABLE_FRAME_SERVICE=1
ENABLE_AUDIO_SERVICE=1
ENABLE_AGENT=1
ENABLE_USB_DHCP=1
ENABLE_CONFIG_WEB=1
ENABLE_TTYD=1
ENABLE_WIFIDRV=1
ENABLE_WLAN_GUARD=0
# Enable AIC8800D80 Wi-Fi 6 HE on 2.4 GHz and 5 GHz; 0 falls back to HT/VHT after reboot.
AICO_WIFI_HE=1
# Request firmware low-power mode for STA operation; keeps normal packet delivery.
AICO_WIFI_LOW_POWER=1
ENABLE_BLUETOOTH_HCI=1
ENABLE_BLE_SERVICE=1
ENABLE_ZRAM=1
ENABLE_SWAP=1

ZRAM_SIZE_MB=64
ZRAM_SWAPPINESS=100
ZRAM_COMP_ALGORITHM=lzo
