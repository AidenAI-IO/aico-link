[Unit]
Requires=aico-wifi-driver.service aico-userdata-migrate.service
After=aico-wifi-driver.service aico-userdata-migrate.service

[Service]
Environment=AICO_WPA_SUPPLICANT_CONFIG=/userdata/debian/wifi/wpa_supplicant-wlan0.conf
EnvironmentFile=-/run/aico/wpa_supplicant-config.env
ExecStart=
ExecStartPre=/usr/lib/aico/aico-wifi-log-retention
ExecStart=/usr/sbin/wpa_supplicant -c ${AICO_WPA_SUPPLICANT_CONFIG} -i %I
StandardOutput=append:/var/log/wpa_supplicant/wlan0.log
StandardError=append:/var/log/wpa_supplicant/wlan0.log
Restart=on-failure
RestartSec=2s
