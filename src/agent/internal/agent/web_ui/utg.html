<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device navigation graph · Aico Debug</title>
<style>
:root{color-scheme:light dark;font:16px system-ui}body{margin:2rem auto;padding:0 1rem;max-width:72rem}header{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}h1{margin-right:auto}a{color:LinkText}button{font:inherit}#diagram{overflow:auto;border:1px solid GrayText;border-radius:.5rem;max-height:65vh}svg{display:block;color:CanvasText}svg text{fill:currentColor;font:14px system-ui}svg rect{fill:Canvas;stroke:currentColor}svg .current rect{stroke-width:3}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:.45rem;border-bottom:1px solid GrayText}#preview{max-width:100%;max-height:320px}details{margin:1rem 0}
</style>
<header><h1>Device navigation graph</h1><a href="/coordinate-debug">Coordinate Debug</a><button id="refresh">Refresh</button><button id="reset">Reset graph</button></header>
<p id="status" role="status">Loading…</p>
<label>App <select id="app"><option value="">All apps</option></select></label>
<p>Arrows show recorded navigation actions. A thick outline marks the last learned state, not a live screen match.</p>
<div id="diagram"></div>
<p id="selection" aria-live="polite"></p><img id="preview" hidden alt="Representative screenshot of selected state">
<details><summary>Recorded transitions (table)</summary><table><thead><tr><th>Edge</th><th>From</th><th>To</th><th>Raw action</th><th>Visits</th></tr></thead><tbody id="edges"></tbody></table></details>
<script>
'use strict';
const el = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs={}, text='') => {
  const node = document.createElementNS(svgNS, tag);
  for (const [k,v] of Object.entries(attrs)) node.setAttribute(k,v);
  node.textContent = text;
  return node;
};
let graph = {};
function render() {
  const nodes = (graph.nodes || []).filter(n => !el('app').value || n.app === el('app').value);
  const located = new Map(nodes.map((n,i) => [n.key,{x:24+(i%3)*292,y:30+Math.floor(i/3)*116}]));
  const edges = (graph.edges || []).filter(e => located.has(e.from) && located.has(e.to));
  el('edges').replaceChildren(); el('preview').hidden = true; el('preview').removeAttribute('src'); el('selection').textContent = '';
  el('status').textContent = nodes.length ? `${nodes.length} states · ${edges.length} transitions` : 'No states learned yet. Finish a device-control turn, then refresh.';
  if (!nodes.length) {el('diagram').replaceChildren(); return;}
  const svg = svgEl('svg',{width:900,height:Math.ceil(nodes.length/3)*116,role:'group','aria-label':'Directed navigation graph'});
  const marker = svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});
  marker.append(svgEl('path',{d:'M 0 1 L 9 5 L 0 9 z',fill:'currentColor'}));
  const defs=svgEl('defs'); defs.append(marker); svg.append(defs);
  edges.forEach(e => {
    const a=located.get(e.from), b=located.get(e.to), bend=12+(e.id%5)*6;
    const forward = b.x > a.x;
    const sameColumn = a.x === b.x;
    const x1 = a.x + (forward || sameColumn ? 240 : 0), x2 = b.x + (forward ? 0 : 240);
    const y1=a.y+18+(e.id%4)*9, y2=b.y+18+(e.id%4)*9;
    const path = svgEl('path',{d:`M${x1} ${y1} C${x1+(forward||sameColumn?bend:-bend)} ${y1+(a.y===b.y?-38:0)},${x2+(forward?-bend:bend)} ${y2+(a.y===b.y?-38:0)},${x2} ${y2}`,fill:'none',stroke:'currentColor','marker-end':'url(#arrow)'});
    path.append(svgEl('title',{},`#${e.id}: ${e.action.join(' ')} · ${e.visits} visits`));
    svg.append(path);
    const row=document.createElement('tr');
    for(const value of [e.id,e.from,e.to,e.action.join(' '),e.visits]) {const cell=document.createElement('td');cell.textContent=value;row.append(cell);}
    el('edges').append(row);
  });
  nodes.forEach(n => {
    const {x,y}=located.get(n.key), current=n.key===graph.current;
    const group=svgEl('g',{transform:`translate(${x} ${y})`,class:current?'current':'',tabindex:0,role:'button','aria-label':`${n.name || n.key}, ${n.app}${current?', last learned state':''}`});
    group.append(svgEl('rect',{width:240,height:64,rx:8}),svgEl('text',{x:12,y:24},(n.name || n.key).slice(0,27)),svgEl('text',{x:12,y:47},`${n.app.slice(0,16)} · ${n.visits}×${n.home?' · Home':''}`),svgEl('title',{},n.key));
    const select=()=>{el('selection').textContent=`${n.name || n.key} (${n.key})`;el('preview').hidden=!n.thumbnail;if(n.thumbnail)el('preview').src='data:image/jpeg;base64,'+n.thumbnail;};
    group.addEventListener('click',select);
    group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}});
    svg.append(group);
  });
  el('diagram').replaceChildren(svg);
}
async function withGraphRequest(run) {
  if (el('refresh').disabled) return;
  el('refresh').disabled = el('reset').disabled = true;
  try { await run(); }
  finally { el('refresh').disabled = el('reset').disabled = false; }
}
async function refresh() {
  return withGraphRequest(async () => {
    try {
      const res = await fetch('/api/debug/utg',{cache:'no-store'});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      graph=await res.json();
      const apps=[...new Set((graph.nodes||[]).map(n=>n.app).filter(Boolean))].sort();
      const previous=el('app').value;
      el('app').replaceChildren(new Option('All apps',''),...apps.map(a=>new Option(a,a)));
      if(apps.includes(previous)) el('app').value=previous;
      render();
    } catch(err) {el('status').textContent=`Unable to load navigation graph: ${err.message}`;}
  });
}
async function resetGraph() {
  if (!window.confirm('Clear all learned navigation states and transitions? This cannot be undone. Chat history and device data will not change.')) return;
  return withGraphRequest(async () => {
    try {
      const res = await fetch('/api/debug/utg',{method:'DELETE', mode:'same-origin'});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      graph = {};
      el('app').replaceChildren(new Option('All apps',''));
      render();
      el('status').textContent = 'Navigation graph reset. New device-control turns will rebuild it.';
    } catch(err) {el('status').textContent=`Unable to reset navigation graph: ${err.message}`;}
  });
}
el('refresh').addEventListener('click',refresh);
el('reset').addEventListener('click',resetGraph);
el('app').addEventListener('change',render);
refresh();
</script>
</html>
