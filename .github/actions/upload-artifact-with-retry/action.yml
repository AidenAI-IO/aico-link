name: Upload artifact with retry
description: Upload a workflow artifact with bounded whole-operation retries.

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Files or directories to upload.
    required: true
  if-no-files-found:
    description: Behavior when no files match the path.
    required: false
    default: warn
  retention-days:
    description: Artifact retention period in days.
    required: false
    default: '0'
  compression-level:
    description: Zip compression level from 0 through 9.
    required: false
    default: '6'
  include-hidden-files:
    description: Include hidden files in the artifact.
    required: false
    default: 'false'
  retry-count:
    description: Total upload attempts, from 1 through 10.
    required: false
    default: '10'
  retry-delay-seconds:
    description: Base delay; each retry waits this value times completed attempts.
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Validate retry policy
      shell: bash
      env:
        RETRY_COUNT: ${{ inputs.retry-count }}
        RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
      run: |
        set -euo pipefail
        if [[ ! "$RETRY_COUNT" =~ ^([1-9]|10)$ ]]; then
          echo "retry-count must be an integer from 1 through 10" >&2
          exit 2
        fi
        if [[ ! "$RETRY_DELAY_SECONDS" =~ ^[0-9]+$ ]]; then
          echo "retry-delay-seconds must be a non-negative integer" >&2
          exit 2
        fi

    - name: Upload artifact (attempt 1)
      id: upload_1
      continue-on-error: ${{ inputs.retry-count > 1 }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true

    - name: Wait before attempt 2
      if: ${{ steps.upload_1.outcome == 'failure' && inputs.retry-count >= 2 }}
      shell: bash
      env:
        RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        COMPLETED_ATTEMPTS: '1'
      run: |
        delay=$((RETRY_DELAY_SECONDS * COMPLETED_ATTEMPTS))
        echo "Artifact upload failed after ${COMPLETED_ATTEMPTS} attempt(s); retrying in ${delay}s"
        sleep "$delay"

    - name: Upload artifact (attempt 2)
      id: upload_2
      if: ${{ steps.upload_1.outcome == 'failure' && inputs.retry-count >= 2 }}
      continue-on-error: ${{ inputs.retry-count > 2 }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true

    - name: Wait before attempt 3
      if: ${{ steps.upload_2.outcome == 'failure' && inputs.retry-count >= 3 }}
      shell: bash
      env:
        RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        COMPLETED_ATTEMPTS: '2'
      run: |
        delay=$((RETRY_DELAY_SECONDS * COMPLETED_ATTEMPTS))
        echo "Artifact upload failed after ${COMPLETED_ATTEMPTS} attempt(s); retrying in ${delay}s"
        sleep "$delay"

    - name: Upload artifact (attempt 3)
      id: upload_3
      if: ${{ steps.upload_2.outcome == 'failure' && inputs.retry-count >= 3 }}
      continue-on-error: ${{ inputs.retry-count > 3 }}
      uses: actions/upload-artifact@v4
