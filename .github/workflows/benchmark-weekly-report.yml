name: Benchmark Weekly Report

on:
  push:
    branches:
      - worktree-benchmark-weekly-report
  schedule:
    # Every Thursday at 01:07 UTC (09:07 Asia/Shanghai).
    - cron: '7 1 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-report:
    # GitHub-hosted runners cannot reach the self-hosted benchmark's LAN proxy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      BENCHMARK_REPORT_LARK_WEBHOOK_URL: ${{ secrets.BENCHMARK_REPORT_LARK_WEBHOOK_URL }}
      BENCHMARK_REPORT_LARK_WEBHOOK_SECRET: ${{ secrets.BENCHMARK_REPORT_LARK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Install Python and benchmark dependencies
        working-directory: benchmark
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12
      - name: Validate required credentials
        env:
          REQUIRED_VALUES: >-
            LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY
            LANGFUSE_BASE_URL
        run: |
          set -euo pipefail
          missing=()
          for name in $REQUIRED_VALUES; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required configuration: ${missing[*]}" >&2
            exit 1
          fi
      - name: Generate weekly report
        working-directory: benchmark
        run: |
          set -euo pipefail
          uv run python -m ci.generate_dashboard \
            --output dashboard.html \
            --data-output dashboard-data.json \
            --weekly-output weekly-report.md \
            --lookback-days 14 \
            --branch-filter main

          if [[ -f weekly-report.md ]]; then
            cat weekly-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload to OSS
        id: upload
        if: ${{ always() }}
        continue-on-error: true
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -uo pipefail
          if [[ -z "${OSS_ACCESS_KEY_ID:-}" || -z "${OSS_ACCESS_KEY_SECRET:-}" ]]; then
            echo "OSS credentials not configured, skipping upload" >&2
            exit 0
          fi
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -q /tmp/ossutil.zip -d /tmp
          chmod +x /tmp/ossutil-v1.7.19-linux-amd64/ossutil
          /tmp/ossutil-v1.7.19-linux-amd64/ossutil config \
            -e oss-cn-hongkong.aliyuncs.com \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET"
          prefix="oss://firmware-agent/benchmark/weekly/${{ github.run_number }}"
          cd benchmark
          # Correct metadata is necessary; OSS default domains still force HTML downloads.
          if [[ -f dashboard.html ]]; then
            /tmp/ossutil-v1.7.19-linux-amd64/ossutil cp dashboard.html "$prefix/dashboard.html" \
              --meta "Content-Type:text/html; charset=utf-8#Content-Disposition:inline" -f
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          fi
          for file in dashboard-data.json weekly-report.md; do
            if [[ -f "$file" ]]; then
              /tmp/ossutil-v1.7.19-linux-amd64/ossutil cp "$file" "$prefix/$file"
            fi
          done
          echo "Files uploaded to $prefix/" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify online preview
        id: preview
        if: ${{ steps.upload.outcome == 'success' && steps.upload.outputs.uploaded == 'true' }}
        working-directory: benchmark
        env:
          REPORT_BASE_URL: ${{ vars.BENCHMARK_REPORT_BASE_URL }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          base = os.environ.get("REPORT_BASE_URL", "").strip().rstrip("/")
          if not base:
              message = "Configure BENCHMARK_REPORT_BASE_URL with an HTTPS custom domain. OSS default domains force HTML downloads; no preview link or Lark notification was published."
              print("::warning::" + message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\n" + message + "\n")
              raise SystemExit(0)
          parsed = urllib.parse.urlsplit(base)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("BENCHMARK_REPORT_BASE_URL must be an HTTPS base URL without credentials, query, or fragment.")
          url = f"{base}/benchmark/weekly/{os.environ['GITHUB_RUN_NUMBER']}/dashboard.html"
          request = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; benchmark-weekly-report)",
              "Accept": "text/html,application/xhtml+xml",
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.headers.get_content_type() != "text/html":
                      raise SystemExit(f"Preview URL returned {response.headers.get_content_type()}, expected text/html.")
                  if response.headers.get("Content-Disposition", "").lower().startswith("attachment") or response.headers.get("x-oss-force-download", "").lower() == "true":
                      raise SystemExit("Preview URL still forces a download. Configure a custom domain or reverse proxy.")
                  if hashlib.sha256(response.read()).digest() != hashlib.sha256(Path("dashboard.html").read_bytes()).digest():
                      raise SystemExit("Preview URL does not serve this run's dashboard.")
          except urllib.error.HTTPError as e:
              raise SystemExit(f"Preview URL returned HTTP {e.code}: {e.reason}. Check OSS bucket read permissions and CDN/domain configuration.") from None
          except urllib.error.URLError as e:
              raise SystemExit(f"Failed to reach preview URL: {e.reason}") from None
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"dashboard_url={url}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\n[Open benchmark dashboard]({url})\n")
          PY
      - name: Send Lark notification
        if: ${{ success() && steps.preview.outputs.dashboard_url != '' }}
        continue-on-error: true
        working-directory: benchmark
        env:
          DASHBOARD_URL: ${{ steps.preview.outputs.dashboard_url }}
        run: |
          uv run python -m ci.notify_lark \
            --data-json dashboard-data.json \
            --dashboard-url "$DASHBOARD_URL"
      - name: Upload weekly report artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            benchmark/dashboard.html
            benchmark/dashboard-data.json
            benchmark/weekly-report.md
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9
